name: medibroadcast
description: Broadcast messaging app for medical distributors
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  provider: ^6.1.2
  http: ^1.2.1
  flutter_svg: ^2.0.10
  intl: ^0.19.0
  flutter_spinkit: ^5.2.1
  fluttertoast: ^9.0.0
  uuid: ^4.4.0
  image_picker: ^1.1.1
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/


